<div id="portal" style="position:fixed;left:0;top:0;z-index:9999"></div>

<script src="bom-data.js"></script>
<script type="module">
import React, {useState, useMemo, useCallback, useEffect, useRef} from 'react';
import {createRoot} from 'react-dom/client';
import {DataEditor, GridCellKind} from '@glideapps/glide-data-grid';
const h = React.createElement;

/* ---------- helpers ---------- */
const fmt = (v,d=0) => v==null || v==='' ? '' : Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const bomCost = (p, month) => p.bom.reduce((a,[c,q])=>a+q*priceFor(c,month).rate,0);   // rate from the monthly price list
const monthName = k => new Date(k+'-01').toLocaleString('en-IN',{month:'long',year:'numeric'});
const shortMonth = k => new Date(k+'-01').toLocaleString('en-IN',{month:'short',year:'2-digit'});
const isoDay = d => d.toLocaleDateString('en-CA');                       // YYYY-MM-DD

/* Group items by side (Motor / Pump / Panel / Packing) into flat rows: g = group header, d = item, t = total */
function groupRows(items, collapsed, sort, sumKeys){
  const rows = [];
  const sorter = sort ? (a,b)=>{ const x=a[sort.k], y=b[sort.k]; return (typeof x==='number' ? x-y : String(x).localeCompare(String(y))) * sort.dir; } : null;
  SECORD.forEach(sec=>{
    let list = items.filter(i=>i.sec===sec); if(!list.length) return;
    if(sorter) list = [...list].sort(sorter);
    const sums = {}; sumKeys.forEach(k=>sums[k]=list.reduce((a,b)=>a+(+b[k]||0),0));
    rows.push({t:'g', sec, count:list.length, sums});
    if(!collapsed.has(sec)) list.forEach(it=>rows.push({t:'d', it}));
  });
  const sums = {}; sumKeys.forEach(k=>sums[k]=items.reduce((a,b)=>a+(+b[k]||0),0));
  rows.push({t:'t', sums});
  return rows;
}
const rowTheme = rows => row => {
  const r = rows[row]; if(!r) return undefined;
  if(r.t==='g') return {bgCell:SEC[r.sec].bg, baseFontStyle:'600 13px', textDark:SEC[r.sec].c};
  if(r.t==='t') return {bgCell:'#e2efda', baseFontStyle:'700 13px'};
  return undefined;
};

let CURRENT_GRID = null;
function useExportSource(src){
  const ref = useRef({});
  Object.assign(ref.current, src);
  CURRENT_GRID = ref.current;
  useEffect(()=>()=>{ if(CURRENT_GRID===ref.current) CURRENT_GRID = null; }, []);
}
const cellValue = c => {
  if(!c) return '';
  if(c.kind===GridCellKind.Number) return typeof c.data==='number' ? c.data : '';
  return String(c.displayData ?? c.data ?? '').replace(/^[▾▸]\s*/, '').replace(/ /g, '').replace(/\s{2,}/g, ' ').trim();
};
function buildExport(src, o){
  let ci = src.cols.map((c,i)=>i).filter(i=>o.cols.has(i));
  let ri = src.rows.map((r,i)=>i);
  const rg = src.sel?.current?.range;
  if(o.scope==='sel' && rg){ ri = ri.filter(i=>i>=rg.y && i<rg.y+rg.height); ci = ci.filter(i=>i>=rg.x && i<rg.x+rg.width); }
  if(!o.groups) ri = ri.filter(i=>!['g','t'].includes(src.rows[i]?.t));
  const aoa = [];
  if(o.header) aoa.push(ci.map(i=>src.cols[i].xl || src.cols[i].l));
  ri.forEach(r=>aoa.push(ci.map(c=>cellValue(src.getCell([c, r])))));
  return aoa;
}

let XLSX_P = null;

const MIME = {xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv:'text/csv'};

// Save a file: Chrome/Edge → native "Save As" dialog; otherwise a download link attached to the page.
// Returns 'saved' | 'cancelled'.
async function saveFile(blob, name, ext){
  if(window.showSaveFilePicker){
    try {
      const fh = await window.showSaveFilePicker({suggestedName:name, types:[{description:ext.toUpperCase()+' file', accept:{[MIME[ext]]:['.'+ext]}}]});
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      return 'saved';
    } catch(e){
      if(e.name==='AbortError') return 'cancelled';            // user closed the Save As dialog
      // SecurityError (embedded frame) etc. → fall through to the download link
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);            // keep the file alive long enough for slow downloads
  return 'saved';
}
async function downloadAoa(aoa, base, fmt, sheetName){
  if(fmt==='xlsx'){
    let XLSX = null;
    try { XLSX = await loadXlsx(); } catch(e){ /* offline → CSV below */ }
    if(XLSX){
      const ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();
      ws['!cols'] = (aoa[0]||[]).map((_,i)=>({wch:Math.min(45, Math.max(8, ...aoa.map(r=>String(r[i] ?? '').length + 2)))}));
      XLSX.utils.book_append_sheet(wb, ws, sheetName.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) || 'Sheet1');
      const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      return {result: await saveFile(new Blob([out], {type:MIME.xlsx}), base + '.xlsx', 'xlsx'), fmt:'xlsx'};
    }
  }
  const esc = v => typeof v==='number' ? String(v) : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const blob = new Blob(['﻿' + aoa.map(r=>r.map(esc).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  return {result: await saveFile(blob, base + '.csv', 'csv'), fmt:'csv'};
}

/* Shared grid wrapper: Excel-like defaults + selection Sum/Count/Average */
function Grid({cols, rows, getCell, onEdit, onToggle, onCell, onDelete, sort, setSort, freeze=1, height, onStats, rowThemeFn}){
  const [widths, setWidths] = useState({});
  const [sel, setSel] = useState(undefined);
  useExportSource({cols, rows, getCell, sel});
  const [search, setSearch] = useState(false);
  const columns = useMemo(()=>cols.map(c=>({
    id:c.k, width:widths[c.k] ?? c.w, group:c.g,
    title: c.l + (sort && sort.k===c.k ? (sort.dir>0?'  ▲':'  ▼') : ''),
  })), [cols, widths, sort]);

  useEffect(()=>{
    const onKey = e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f'){ e.preventDefault(); setSearch(true); } };
    window.addEventListener('keydown', onKey); return ()=>window.removeEventListener('keydown', onKey);
  }, []);

  const onSel = useCallback(s=>{
    setSel(s);
    const rg = s?.current?.range; if(!rg || !onStats) return;
    let sum=0, n=0, cnt=0;
    for(let y=rg.y; y<rg.y+rg.height; y++) for(let x=rg.x; x<rg.x+rg.width; x++){
      const c = getCell([x,y]); if(c.displayData) cnt++;
      if(c.kind===GridCellKind.Number && typeof c.data==='number'){ sum+=c.data; n++; }
    }
    onStats(rg.width*rg.height>1 ? {sum, n, cnt} : null);
  }, [getCell, onStats]);

  return h(DataEditor, {
    columns, rows: rows.length, theme,
    getCellContent: can('edit') ? getCell : (cell=>({...getCell(cell), allowOverlay:false, readonly:true})),   // Viewer: no editing
    width:'100%', height: height ?? '100%',
    rowMarkers:'number', freezeColumns:freeze, smoothScrollX:true, smoothScrollY:true,
    rowHeight:26, headerHeight:34, groupHeaderHeight:24,
    getCellsForSelection:true,          // enables Ctrl+C copy (pastes into Excel as tab-separated)
    onPaste:can('edit'),                 // paste from Excel into editable (orange) cells
    rangeSelect:'rect', columnSelect:'none', rowSelect:'multi',
    gridSelection: sel, onGridSelectionChange: onSel,
    getRowThemeOverride: rowThemeFn || rowTheme(rows),
    onColumnResize: (col, w) => setWidths(p=>({...p, [col.id]:w})),
    onHeaderClicked: col => setSort && setSort(s => { const k=cols[col].k;
      return !s || s.k!==k ? {k, dir:1} : s.dir>0 ? {k, dir:-1} : null; }),
    onCellClicked: ([col,row]) => { if(rows[row]?.t==='g' && col===0 && onToggle) onToggle(rows[row].sec); else if(onCell) onCell([col,row]); },
    onCellEdited: can('edit') ? onEdit : undefined,
    ...(onDelete ? {onDelete: can('edit') ? onDelete : ()=>false} : {}),
    showSearch: search, onSearchClose: ()=>setSearch(false),
  });
}

/* Shared header search: two boxes. Inside a box "|" means OR; the two boxes are combined with AND.
   e.g.  [ bearing | seal ]  [ motor ]  → rows containing (bearing OR seal) AND motor.
   Ctrl+] types " | " at the cursor. Esc clears the box. */
const SEARCH_TIP = 'Use | for OR (Ctrl+] inserts it). Both boxes must match (AND).';
function SearchInput({value, onChange, placeholder}){
  const key = e => {
    if(e.key==='Escape'){ onChange(''); return; }
    if(e.ctrlKey && (e.key===']' || e.code==='BracketRight')){
      e.preventDefault();
      const el = e.target, st = el.selectionStart ?? value.length, en = el.selectionEnd ?? value.length;
      const next = value.slice(0, st) + ' | ' + value.slice(en);
      onChange(next);
      requestAnimationFrame(()=>{ el.selectionStart = el.selectionEnd = st + 3; });
    }
  };
  return h('div', {className:'tsearch'},
    h('span', {className:'pick-ico'}, '⌕'),
    h('input', {value, placeholder, title:SEARCH_TIP, className:value?'has':'', onChange:e=>onChange(e.target.value), onKeyDown:key}),
    value ? h('button', {className:'tsx', title:'Clear', onClick:()=>onChange('')}, '✕') : null);
}
function SearchBox({value, onChange, placeholder='Search…'}){
  const [a, b] = value;
  return h('div', {className:'tsearch2'},
    h(SearchInput, {value:a, onChange:v=>onChange([v, b]), placeholder}),
    h('span', {className:'and'}, '&'),
    h(SearchInput, {value:b, onChange:v=>onChange([a, v]), placeholder:'and…'}));
}
const hasQ = q => (Array.isArray(q) ? q : [q]).some(x=>String(x).trim());
// q: string or [box1, box2]. Each box: terms split by "|" (OR). Boxes: AND. Empty box = no filter.
const matchQ = (q, ...vals) => {
  const hay = vals.map(v=>String(v ?? '').toLowerCase());
  return (Array.isArray(q) ? q : [q]).every(box=>{
    const terms = String(box).split('|').map(t=>t.trim().toLowerCase()).filter(Boolean);
    return !terms.length || terms.some(t=>hay.some(v=>v.includes(t)));
  });
};

/* ---------- Monthly requirement sheet ---------- */
// Gross requirement per item between two dates, with the models that use it (NRP totals × BOM qty).
function computeReq(from, to){
  const plan = planBetween(from, to), req = {};
  PRODUCTS.forEach(p=>{ const n = plan[p.code] || 0; if(!n) return;
    p.bom.forEach(([c, per])=>{
      const r = req[c] ||= {...MAT[c], gross:0, uses:[]};
      r.gross += n * per;
      const u = r.uses.find(u=>u.model===p.code);
      if(u){ u.per += per; u.qty += n * per; } else r.uses.push({model:p.code, p, plan:n, per, qty:n * per});
    }); });
  return Object.values(req).filter(r=>r.gross>0).sort((a,b)=>a.code.localeCompare(b.code));
}

function MrpSheet({range, onStats}){
  const [q, setQ] = useState(['','']);
  const [collapsed, setCollapsed] = useState(new Set());     // sides folded
  const [open, setOpen] = useState(new Set());               // items drilled down
  const [sort, setSort] = useState(null);
  const items = computeReq(range.from, range.to).filter(i=>matchQ(q, i.code, i.item, i.desc, i.uom, ...i.uses.map(u=>u.model)));
  const sorter = sort ? (a,b)=>{ const x=a[sort.k], y=b[sort.k]; return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sort.dir; } : null;

  const rows = [];
  SECORD.forEach(sec=>{
    let list = items.filter(i=>i.sec===sec); if(!list.length) return;
    if(sorter) list = [...list].sort(sorter);
    rows.push({t:'g', sec, count:list.length});
    if(collapsed.has(sec)) return;
    list.forEach(it=>{
      rows.push({t:'i', it});
      if(open.has(it.code)) it.uses.forEach(u=>rows.push({t:'m', it, u}));
    });
  });

  const getCell = useCallback(([col,row])=>{
    const r = rows[row], k = MP_COLS[col].k;
    if(!r) return txt('');
    if(r.t==='g') return col===0 ? txt(`${collapsed.has(r.sec)?'▸':'▾'}  ${SEC[r.sec].label}  (${r.count})`) : txt('');
    if(r.t==='i'){
      const it = r.it;
      if(k==='code')  return txt(`${open.has(it.code)?'▾':'▸'}  ${it.code}`);
      if(k==='desc')  return txt(it.desc);
      if(k==='uom')   return txt(it.uom, {contentAlign:'center'});
      return num(it.gross, 1, {themeOverride:{baseFontStyle:'600 13px'}});
    }
    const u = r.u;                                            // model drill-down row
    if(k==='code')  return txt(IND + u.model);
    if(k==='desc')  return txt(assemblyName(r.it.sec, u.p));
    if(k==='uom')   return txt(r.it.uom, {contentAlign:'center'});
    return num(u.qty, 1);
  }, [rows, collapsed, open]);

  const theme = useCallback(row=>{
    const r = rows[row]; if(!r) return undefined;
    if(r.t==='g') return {bgCell:SEC[r.sec].bg, baseFontStyle:'600 13px', textDark:SEC[r.sec].c};
    if(r.t==='m') return {bgCell:'#fafafa', textDark:'#666'};
    return undefined;
  }, [rows]);

  const toggleSide = sec => setCollapsed(s=>{ const n=new Set(s); n.has(sec)?n.delete(sec):n.add(sec); return n; });
  const toggleItem = code => setOpen(s=>{ const n=new Set(s); n.has(code)?n.delete(code):n.add(code); return n; });

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'}, h('div', {className:'l1'}, h('h2', null, 'Material Planning'))),
      h('div', {className:'acts'},
        h(DateRange, range),
        h('span', {className:'vsep'}),
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h('button', {className:'ib', title:'Collapse all', onClick:()=>{ setCollapsed(new Set()); setOpen(new Set()); }}, '⊟'),
        h('button', {className:'ib', title:'Expand all', onClick:()=>{ setCollapsed(new Set()); setOpen(new Set(items.map(i=>i.code))); }}, '⊞'),
        h('button', {className:'ib', title:'Clear sort', onClick:()=>setSort(null)}, '⇅'))),
    h('div', {className:'gridbox'}, h(Grid, {cols:MP_COLS, rows, getCell, onToggle:toggleSide, sort, setSort, freeze:1, onStats, rowThemeFn:theme,
      onCell:([col,row])=>{ if(col===0 && rows[row]?.t==='i') toggleItem(rows[row].it.code); }}))
  );
}

/* ---------- Material Master: one row per item code; edits become change requests ---------- */
const MASTER_FIELDS = {item:'Item', spec:'Description', uom:'UOM', make:'Make', suppliers:'Suppliers', sub:'Sub-assembly', mb:'Make/Buy', lead:'Lead Days'};
const NUM_FIELDS = new Set(['lead']);
const MASTER_COLS = [
  {k:'code', l:'Item Code', w:130}, {k:'ver', l:'Ver', w:50}, {k:'item', l:'Item', w:180}, {k:'spec', l:'Description', w:220},
  {k:'uom', l:'UOM', w:60}, {k:'make', l:'Make', w:110}, {k:'suppliers', l:'Suppliers', w:290},
  {k:'sub', l:'Sub-assembly', w:110}, {k:'mb', l:'Make/Buy', w:80}, {k:'lead', l:'Lead Days', w:80},
  {k:'rateNow', l:'Rate ₹', w:110}, {k:'appr', l:'Approval', w:120},
];
// One pending change request per requester. It collects every edit (any item, any field) until it is approved or rejected.
const pendingReqs = () => CHANGES.filter(c=>c.status==='Pending');
function pendingLine(code, field){
  for(const req of pendingReqs()){ const line = req.lines.find(l=>l.code===code && l.field===field); if(line) return {req, line}; }
  return null;
}
const pendingLinesFor = code => pendingReqs().flatMap(r=>r.lines.filter(l=>l.code===code));
const bumpsVersion = lines => lines.some(l=>VERSIONED_FIELDS.has(l.field));

// Approve = apply all lines. Items whose Item / Description / UOM / Make changed get the next version (once per item).
function applyRequest(req, approver){                     // TODO: server does this in one transaction
  req.versions = {};
  const byItem = {};
  req.lines.forEach(l=>(byItem[l.code] ||= []).push(l));
  Object.entries(byItem).forEach(([code, lines])=>{
    const x = MAT[code];
    lines.forEach(l=>{ x[l.field] = l.new; });
    x.desc = x.spec ? `${x.item}, ${x.spec}` : x.item;
    x.sup = String(x.suppliers).split(';')[0].trim();
    if(bumpsVersion(lines)){
      req.versions[code] = {from:x.ver, to:x.ver+1};
      x.ver += 1;
      ITEM_VERSIONS.push({code, ver:x.ver, data:snapshot(x), approvedBy:approver, approvedAt:new Date(), reqId:req.id});
    }
  });
}

function Seg({value, onChange}){
  return h('div', {className:'seg'},
    [['items','Item Master'], ['prices','Monthly Prices']].map(([k,l])=>
      h('button', {key:k, className:value===k?'on':'', onClick:()=>onChange(k)}, l)));
}

/* Unsaved edits (drafts). Editing a cell only lands here; Save turns them into change-request lines. */
const DRAFT = new Map();                                     // 'code|field' → {code, field, new}
const draftOf = (code, field) => DRAFT.get(code + '|' + field);
// value the user currently sees as "committed": pending request value if any, else the approved master value
const baseValue = (code, field) => { const hit = pendingLine(code, field); return hit ? hit.line.new : MAT[code][field]; };

function saveDraft(role){                                    // TODO: POST /api/change-requests (one call with all lines)
  DRAFT.forEach(({code, field, new:nv})=>{
    const old = MAT[code][field], hit = pendingLine(code, field);
    if(String(nv)===String(old)){                            // saved back to the approved value → drop the pending line
      if(hit){ hit.req.lines.splice(hit.req.lines.indexOf(hit.line), 1); if(!hit.req.lines.length) CHANGES.splice(CHANGES.indexOf(hit.req), 1); }
    } else if(hit){ hit.line.new = nv; hit.req.at = new Date(); }
    else {
      let req = pendingReqs().find(c=>c.by===role);
      if(!req) CHANGES.push(req = {id:CHANGES.reduce((a,c)=>Math.max(a,c.id),0)+1, by:role, at:new Date(), status:'Pending', lines:[]});
      req.lines.push({code, field, old, new:nv}); req.at = new Date();
    }
  });
  DRAFT.clear();
}
const discardDraft = () => DRAFT.clear();

// Warn when the browser tab is closed / reloaded with unsaved edits.
window.addEventListener('beforeunload', e=>{ if(DRAFT.size){ e.preventDefault(); e.returnValue = ''; } });

function ItemMaster({role, bump, onStats, seg, openHistory, ask}){
  const month = CUR_MONTH;
  const [q, setQ] = useState(['','']);
  const [collapsed, setCollapsed] = useState(new Set());
  const [sort, setSort] = useState(null);
  const items = Object.values(MAT).map(x=>{ const p = priceFor(x.code, month);
    return {...x, rateNow:p.rate, _p:p, pend:pendingLinesFor(x.code)}; });
  const rows = groupRows(items.filter(x=>matchQ(q, x.code, x.item, x.spec, x.uom, x.make, x.suppliers, x.sub, x.mb)), collapsed, sort, []);
  const cols = useMemo(()=>MASTER_COLS.map(c=>c.k==='rateNow' ? {...c, l:`Rate ₹ (${shortMonth(month)})`} : c), [month]);

  const getCell = useCallback(([col,row])=>{
    const r = rows[row], k = cols[col].k;
    if(!r) return txt('');
    if(r.t!=='d'){
      if(col===0) return r.t==='g' ? txt(`${collapsed.has(r.sec)?'▸':'▾'}  ${SEC[r.sec].label}  (${r.count})`) : txt(`${items.length} items`);
      return txt('');
    }
    const it = r.it;
    if(k in MASTER_FIELDS){
      const d = draftOf(it.code, k), hit = it.pend.find(l=>l.field===k);
      const v = d ? d.new : hit ? hit.new : it[k], o = d ? {themeOverride:DRAFT_C} : hit ? {themeOverride:AMBER} : {};
      return NUM_FIELDS.has(k)
        ? {kind:GridCellKind.Number, data:v, displayData:fmt(v), allowOverlay:true, readonly:false, contentAlign:'right', ...o}
        : {kind:GridCellKind.Text, data:String(v??''), displayData:String(v??''), allowOverlay:true, readonly:false, ...o};
    }
    if(k==='rateNow') return num(it.rateNow, 2, {themeOverride: it._p.missing ? RED : it._p.carried ? CARRIED : undefined});
    if(k==='ver')  return txt('v'+it.ver, {contentAlign:'center', themeOverride:{textDark:'#0563c1'}});   // click → history
    if(k==='appr' && Object.keys(MASTER_FIELDS).some(f=>draftOf(it.code, f))) return txt('Unsaved', {themeOverride:DRAFT_C});
    if(k==='appr') return !it.pend.length ? txt('')
      : txt(bumpsVersion(it.pend) ? `Pending → v${it.ver+1}` : 'Pending', {themeOverride:AMBER});
    return txt(it[k]);
  }, [rows, cols, collapsed, items.length]);

  // An edit only creates an unsaved draft. Nothing is raised until Save.
  const onEdit = useCallback(([col,row], v)=>{
    const r = rows[row], k = cols[col].k;
    if(r?.t!=='d' || !(k in MASTER_FIELDS)) return;
    const nv = NUM_FIELDS.has(k) ? Number(v.data) : String(v.data ?? '').trim();
    if(NUM_FIELDS.has(k) && (v.data==null || isNaN(nv))) return;
    const code = r.it.code, key = code + '|' + k;
    if(String(nv)===String(baseValue(code, k))) DRAFT.delete(key);   // typed back to what's already there → no draft
    else DRAFT.set(key, {code, field:k, new:nv});
    bump();
  }, [rows, cols, bump]);

  const save = useCallback(()=>{
    if(!DRAFT.size) return;
    ask({title:'Save changes?', ok:'Save', onOk:()=>{ saveDraft(role); bump(); }});
  }, [role, bump, ask]);
  useEffect(()=>{                                            // Ctrl+S saves
    const onKey = e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } };
    window.addEventListener('keydown', onKey); return ()=>window.removeEventListener('keydown', onKey);
  }, [save]);

  const toggle = sec => setCollapsed(s=>{ const n=new Set(s); n.has(sec)?n.delete(sec):n.add(sec); return n; });

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'},
        h('div', {className:'l1'}, h('h2', null, 'Material Master'), seg)),
      h('div', {className:'acts'},
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h('button', {className:'ib', title:'Collapse all', onClick:()=>setCollapsed(new Set(SECORD))}, '⊟'),
        h('button', {className:'ib', title:'Expand all', onClick:()=>setCollapsed(new Set())}, '⊞'),
        h('button', {className:'ib', title:'Clear sort', onClick:()=>setSort(null)}, '⇅'),
        can('edit') ? h('span', {className:'vsep'}) : null,
        can('edit') && DRAFT.size ? h('span', {className:'unsaved'}, `${DRAFT.size} unsaved`) : null,
        can('edit') ? h('button', {className:'btn', disabled:!DRAFT.size, onClick:()=>{ discardDraft(); bump(); }}, 'Discard') : null,
        can('edit') ? h('button', {className:'btn primary', disabled:!DRAFT.size, title:'Save (Ctrl+S) – raises a change request', onClick:save}, 'Save') : null)),
    h('div', {className:'gridbox'}, h(Grid, {cols, rows, getCell, onEdit, onToggle:toggle, sort, setSort, onStats,
      onCell:([col,row])=>{ if(cols[col].k==='ver' && rows[row]?.t==='d') openHistory(rows[row].it.code); }}))
  );
}

/* ---------- Change Requests tab: one entry per request + item version history ---------- */
const when = d => d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

// Each change request is a card: header (who / when / status / actions) + a simple table of its changes.
function RequestList({role, bump, ask, q, from, to}){
  const hit = req => inRange(isoDay(req.at), from, to) && matchQ(q, '#'+req.id, req.by, req.status, ...req.lines.flatMap(l=>[l.code, MAT[l.code]?.item, MASTER_FIELDS[l.field], l.old, l.new]));
  const list = CHANGES.filter(hit).sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1) || b.at-a.at);
  const canA = can('approve');
  const decide = (req, ok) => { if(ok) applyRequest(req, role); req.status = ok ? 'Approved' : 'Rejected'; req.decidedBy = role; req.decidedAt = new Date(); bump(); };

  // Version effect per change line: only Item / Description / UOM / Make lines move the version.
  const verOf = (req, l) => {
    if(!VERSIONED_FIELDS.has(l.field)) return h('span', {className:'muted'}, '—');
    if(req.status==='Approved') return h('b', null, 'v' + req.versions[l.code].to);
    if(req.status==='Rejected') return h('span', {className:'muted'}, 'v' + MAT[l.code].ver);
    return h('b', {style:{color:'#9c5700'}}, `v${MAT[l.code].ver} → v${MAT[l.code].ver + 1}`);
  };

  const exCols = [{k:'id',l:'Request'},{k:'status',l:'Status'},{k:'by',l:'Requested by'},{k:'at',l:'Requested on'},{k:'code',l:'Item Code'},{k:'item',l:'Item'},{k:'field',l:'Field'},{k:'old',l:'Current'},{k:'new',l:'Proposed'}];
  const exRows = list.flatMap(req=>req.lines.map(l=>({t:'d', it:{id:'#'+req.id, status:req.status, by:req.by, at:when(req.at), code:l.code, item:MAT[l.code]?.item, field:MASTER_FIELDS[l.field], old:l.old, new:l.new}})));
  useExportSource({cols:exCols, rows:exRows, getCell:([c,r])=>{ const v = exRows[r]?.it[exCols[c].k]; return typeof v==='number' ? num(v) : txt(v); }, sel:null});

  const sumText = (req, codes, nVer) => `${req.lines.length} change${req.lines.length!==1?'s':''} on ${codes.length} item${codes.length!==1?'s':''}` + (nVer ? ` and creates ${nVer} new version${nVer!==1?'s':''}` : '');
  if(!list.length) return h('div', {className:'empty'}, (hasQ(q) || from || to) ? 'No matching change requests.' : 'No change requests yet. Edit a cell in Material Master → Item Master to start one.');
  return h('div', {className:'cards'}, list.map(req=>{
    const codes = [...new Set(req.lines.map(l=>l.code))];
    const nVer = codes.filter(c=>bumpsVersion(req.lines.filter(l=>l.code===c))).length;
    return h('div', {key:req.id, className:'card '+req.status},
      h('div', {className:'card-h', style:{alignItems:'center'}},
        h('div', {className:'card-t'}, h('b', null, 'Request #' + req.id), h('span', {className:'pill '+req.status}, req.status)),
        req.status==='Pending' ? h('div', {className:'card-a'},
          h('button', {className:'btn no', disabled:!canA, onClick:()=>ask({title:`Reject request #${req.id}?`,
            text:`None of its ${req.lines.length} change${req.lines.length!==1?'s':''} will be applied. This can't be undone.`, ok:'Reject', danger:true, onOk:()=>decide(req,false)})}, 'Reject'),
          h('button', {className:'btn ok', disabled:!canA, title:canA?'':'Only Admin can approve', onClick:()=>ask({title:`Approve request #${req.id}?`,
            text:`This applies ${sumText(req, codes, nVer)} in the material master.`, ok:'Approve', onOk:()=>decide(req,true)})}, 'Approve')) : null),
      h('table', {className:'ctab'},
        h('colgroup', null, ['13%','18%','12%','24%','24%','9%'].map((w,i)=>h('col', {key:i, style:{width:w}}))),
        h('thead', null, h('tr', null, ['Item Code','Item','Field','Current','Proposed','Version'].map(t=>h('th', {key:t}, t)))),
        h('tbody', null, req.lines.map(l=>h('tr', {key:l.code+'|'+l.field},
          h('td', {className:'mono'}, l.code),
          h('td', null, MAT[l.code].item),
          h('td', null, MASTER_FIELDS[l.field]),
          h('td', {className:'old'}, String(l.old)),
          h('td', {className:'new'}, String(l.new)),
          h('td', null, verOf(req, l)))))));
  }));
}

// Styled search box with its own suggestion list (replaces the browser's native datalist dropdown).
function ItemPicker({value, onPick}){
  const [q, setQ] = useState(value || '');
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const [typed, setTyped] = useState(false);               // show the full list until the user types
  useEffect(()=>{ setQ(value || ''); }, [value]);
  const ql = typed ? q.trim().toLowerCase() : '';
  const opts = Object.values(MAT).filter(x=>!ql || (x.code+' '+x.item+' '+x.spec).toLowerCase().includes(ql)).slice(0, 50);
  const pick = x => { onPick(x.code); setQ(x.code); setOpen(false); };
  const key = e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); setOpen(true); setHi(i=>Math.min(i+1, opts.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setHi(i=>Math.max(i-1, 0)); }
    else if(e.key==='Enter' && opts[hi]) pick(opts[hi]);
    else if(e.key==='Escape') setOpen(false);
  };
  return h('div', {className:'picker'},
    h('span', {className:'pick-ico'}, '⌕'),
    h('input', {value:q, placeholder:'Search item code or name…', onKeyDown:key,
      onFocus:e=>{ setOpen(true); setTyped(false); setHi(0); e.target.select(); }, onBlur:()=>setOpen(false),
      onChange:e=>{ setQ(e.target.value); setTyped(true); setOpen(true); setHi(0); }}),
    open ? h('div', {className:'pick-list'}, opts.length ? opts.map((x,i)=>h('div', {key:x.code, className:'pick-o'+(i===hi?' hi':''),
        onMouseDown:e=>{ e.preventDefault(); pick(x); }, onMouseEnter:()=>setHi(i)},
        h('span', {className:'mono'}, x.code), h('span', {className:'pick-n'}, x.item, x.spec ? h('span', {className:'muted'}, ' · '+x.spec) : null),
        h('span', {className:'pick-v'}, 'v'+x.ver)))
      : h('div', {className:'pick-none'}, 'No matching item')) : null);
}

function VersionHistory({code, setCode}){
  const vers = code && MAT[code] ? ITEM_VERSIONS.filter(v=>v.code===code).sort((a,b)=>b.ver-a.ver) : [];
  const fields = [...VERSIONED_FIELDS];
  return h(React.Fragment, null,
    h('div', {className:'vh-bar'},
      h(ItemPicker, {value:code, onPick:setCode}),
      code && MAT[code] ? h('span', {className:'muted'}, `${MAT[code].item} · current v${MAT[code].ver}`) : null),

          return h('tr', {key:v.ver},
            h('td', null, h('b', null, 'v'+v.ver), i===0 ? h('span', {className:'pill Approved', style:{marginLeft:6}}, 'current') : null),

}

/* ---------- Monthly price list: duplicates allowed, lookup picks the latest ---------- */
const PRICE_COLS = [
  {k:'code', l:'Item Code', w:130}, {k:'item', l:'Item', w:180}, {k:'uom', l:'UOM', w:60}, {k:'month', l:'Price Month', w:100},
  {k:'rate', l:'Rate ₹', w:100}, {k:'sup', l:'Supplier', w:220}, {k:'date', l:'Entered On', w:110}, {k:'by', l:'By', w:90},
  {k:'note', l:'Note', w:180}, {k:'used', l:'Lookup', w:100},
];
// Price period filter: shows price entries whose month overlaps the From–To dates (defaults to the selected month).
function PriceList({onStats, seg}){
  const month = CUR_MONTH;
  const [q, setQ] = useState(['','']);
  const [sort, setSort] = useState(null);
  const [from, setFrom] = useState(monthStart(month));
  const [to, setTo] = useState(monthEnd(month));
  const latest = {};                                          // winning entry per item+month
  PRICES.forEach(e=>{ const k=e.code+'|'+e.month, b=latest[k]; if(!b || e.date>b.date || (e.date===b.date && e.id>b.id)) latest[k]=e; });
  let entries = PRICES.filter(e=>(!to || monthStart(e.month)<=to) && (!from || monthEnd(e.month)>=from) && matchQ(q, e.code, MAT[e.code]?.item, e.sup, e.note, e.by))
    .map(e=>({...e, item:MAT[e.code]?.item ?? '?', uom:MAT[e.code]?.uom ?? '', latest:latest[e.code+'|'+e.month]===e}));
  entries.sort(sort ? (a,b)=>{ const x=a[sort.k], y=b[sort.k]; return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sort.dir; }
                    : (a,b)=>a.code.localeCompare(b.code) || a.month.localeCompare(b.month) || a.date.localeCompare(b.date) || a.id-b.id);
  const rows = entries.map(e=>({t:'d', it:e}));

  const getCell = useCallback(([col,row])=>{
    const e = rows[row]?.it, k = PRICE_COLS[col].k; if(!e) return txt('');
    if(k==='rate')  return num(e.rate, 2);
    if(k==='month') return txt(shortMonth(e.month));
    if(k==='date')  return txt(niceDay(e.date));
    if(k==='used')  return e.latest ? txt('Latest', {themeOverride:{textDark:'#006100'}}) : txt('Superseded', {themeOverride:CARRIED});
    return txt(e[k]);
  }, [rows]);

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'}, h('div', {className:'l1'}, h('h2', null, 'Material Master'), seg)),
      h('div', {className:'range'},
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h(DateRange, {from, to, setFrom, setTo}))),
    h('div', {className:'gridbox'}, h(Grid, {cols:PRICE_COLS, rows, getCell, sort, setSort, onStats}))
  );
}

/* ---------- Dashboard: NRP by material, Qty and Price for every month in the From–To range ----------
   Price = price per piece: BOM material cost of one pump, using that month's rates.
   Projection (toggle + gear): NRP qty for a chosen period, priced at the LATEST prices adjusted by a % per commodity. */
const monthsBetween = (from, to) => {
  const out = []; if(!from || !to || from > to) return out;
  let [y, m] = from.slice(0,7).split('-').map(Number); const [ey, em] = to.slice(0,7).split('-').map(Number);
  while((y < ey || (y === ey && m <= em)) && out.length < 24){ out.push(`${y}-${String(m).padStart(2,'0')}`); if(++m > 12){ m = 1; y++; } }
  return out;                                                // capped at 24 months
};
const LATEST_PM = () => PRICES.reduce((a,e)=>e.month > a ? e.month : a, '');      // latest month that has prices
const COMMODITIES = () => [...new Set(Object.values(MAT).map(x=>x.commodity))].sort();
const shortDay = d => d ? new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}) : '';
// Projection settings live for the session (survive tab switches). TODO: save per user via /api/projections
const PROJ = (()=>{ const ds = NRP.map(r=>r.date).sort(), last = (ds[ds.length-1] || isoDay(TODAY)).slice(0,7);
  return {on:false, from:monthStart(last), to:monthEnd(last), pct:{}}; })();
const projRate = (code, pct) => priceFor(code, LATEST_PM()).rate * (1 + (pct[MAT[code].commodity] || 0) / 100);

function Switch({on, onChange, label}){
  return h('label', {className:'switch'},
    h('input', {type:'checkbox', checked:on, onChange:e=>onChange(e.target.checked)}),
    h('span', {className:'sw-track'}, h('span', {className:'sw-knob'})),
    h('span', {className:'sw-label'}, label));
}

// One row per commodity: average latest price of its items (server: GET /api/commodities/summary?month=),
// a slider for the % change, and the resulting projected average. No item lists – they would be too big to fetch.
function commoditySummary(lpm){
  const acc = {};
  Object.values(MAT).forEach(x=>{ const a = acc[x.commodity] ||= {n:0, sum:0}; a.n++; a.sum += priceFor(x.code, lpm).rate; });
  return Object.entries(acc).map(([c, a])=>({c, n:a.n, avg:a.n ? a.sum / a.n : 0})).sort((x,y)=>x.c.localeCompare(y.c));
}
function ProjectionModal({proj, onApply, onClose}){
  const [from, setFrom] = useState(proj.from), [to, setTo] = useState(proj.to);
  const [pct, setPct] = useState({...proj.pct});
  const lpm = LATEST_PM();
  const rowsC = useMemo(()=>commoditySummary(lpm), [lpm]);
  useEffect(()=>{ const k = e=>{ if(e.key==='Escape') onClose(); }; window.addEventListener('keydown', k); return ()=>window.removeEventListener('keydown', k); }, []);
  const setOne = (c, v) => setPct(p=>({...p, [c]: Math.max(-20, Math.min(50, Math.round((+v || 0) * 2) / 2))}));

  return h('div', {className:'modal-bg', onMouseDown:e=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div', {className:'modal proj'},
      h('div', {className:'proj-h'},
        h('h3', null, 'Projection settings'),
        h('span', {className:'muted'}, 'Base: latest prices (' + monthName(lpm) + ')')),
      h('div', {className:'dl-row'}, h('span', {className:'dl-l'}, 'NRP period'), h(DateRange, {from, to, setFrom, setTo})),
      h('div', {className:'proj-list'},
        h('div', {className:'pc-row pc-head'},
          h('span', {className:'pc-n'}, 'Material'), h('span', {className:'pc-a'}, 'Avg price ₹'),
          h('span', {className:'pc-sl-h'}, 'Change'), h('span', {className:'pc-v'}, '%'), h('span', {className:'pc-a'}, 'Projected avg ₹')),
        rowsC.map(({c, n, avg})=>{
          const v = pct[c] || 0, cls = v>0 ? 'up' : v<0 ? 'dn' : '';
          return h('div', {key:c, className:'pc-row'},
            h('span', {className:'pc-n', title:c}, c, h('small', null, n + ' item' + (n!==1?'s':''))),
            h('span', {className:'pc-a'}, fmt(avg, 2)),
            h('input', {type:'range', min:-20, max:50, step:0.5, value:v, className:'pc-sl '+cls, onChange:e=>setOne(c, e.target.value)}),
            h('span', {className:'pc-v '+cls}, h('input', {type:'number', min:-20, max:50, step:0.5, value:v, onChange:e=>setOne(c, e.target.value)}), '%'),
            h('span', {className:'pc-a '+cls}, fmt(avg * (1 + v/100), 2)));
        })),
      h('div', {className:'modal-a', style:{marginTop:12}},
        h('button', {className:'btn', onClick:()=>setPct({})}, 'Reset all to 0%'),
        h('span', {className:'sp'}),
        h('button', {className:'btn', onClick:onClose}, 'Cancel'),
        h('button', {className:'btn primary', disabled:!from || !to || from > to, onClick:()=>onApply({from, to, pct})}, 'Apply'))));
}

function DashboardSheet({onStats}){
  const dates = NRP.map(r=>r.date).sort();
  const [from, setFrom] = useState(monthStart((dates[0] || isoDay(TODAY)).slice(0,7)));
  const [to, setTo] = useState(monthEnd((dates[dates.length-1] || isoDay(TODAY)).slice(0,7)));
  const [q, setQ] = useState(['','']);
  const [sort, setSort] = useState(null);
  const [proj, setProjState] = useState({...PROJ});
  const setProj = p => { Object.assign(PROJ, p); setProjState({...PROJ}); };
  const [gear, setGear] = useState(false);
  const months = monthsBetween(from, to);

  const costCache = {};                                      // BOM cost per pump, per model+month
  const unitCost = (p, m) => costCache[p.code+'|'+m] ??= bomCost(p, m);
  const projCost = p => costCache[p.code+'|P'] ??= p.bom.reduce((a,[c,per])=>a + per * projRate(c, proj.pct), 0);
  const baseCost = p => unitCost(p, LATEST_PM());

  const byMat = {};
  const rowFor = (r, p) => byMat[r.material] ||= {material:r.material, desc:p.name, model:p.code, vendorCode:p.vendorCode, vendor:p.vendor, p};
  NRP.forEach(r=>{
    const p = productByMaterial(r.material); if(!p) return;
    if(inRange(r.date, from, to)){ const row = rowFor(r, p), m = r.date.slice(0,7); row['q_'+m] = (row['q_'+m] || 0) + (+r.qty || 0); }
    if(proj.on && inRange(r.date, proj.from, proj.to)){ const row = rowFor(r, p); row.q_P = (row.q_P || 0) + (+r.qty || 0); }
  });
  let list = Object.values(byMat);
  list.forEach(row=>{
    months.forEach((m,i)=>{
      row['v_'+m] = row['q_'+m] ? unitCost(row.p, m) : 0;
      const prev = i ? row['v_'+months[i-1]] : 0, cur = row['v_'+m];   // change vs previous month's per-piece price
      row['c_'+m] = i && prev && cur ? (cur - prev) / prev * 100 : null;
    });
    if(proj.on){                                             // projected per-piece price vs the latest actual one
      row.v_P = row.q_P ? projCost(row.p) : 0;
      const base = baseCost(row.p);
      row.c_P = row.q_P && base ? (row.v_P - base) / base * 100 : null;
    }
  });
  list = list.filter(r=>matchQ(q, r.material, r.desc, r.model, r.vendorCode, r.vendor));
  list.sort(sort ? (a,b)=>{ const x=a[sort.k] ?? 0, y=b[sort.k] ?? 0; return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sort.dir; }
                 : (a,b)=>a.material.localeCompare(b.material));
  const pg = 'Projection · ' + shortDay(proj.from) + ' – ' + shortDay(proj.to);
  const cols = [
    {k:'material', l:'Material', w:110},
    {k:'desc', l:'Material Description', w:270},
    {k:'vendorCode', l:'Vendor', w:80},
    {k:'vendor', l:'Vendor Name', w:160},
    ...months.flatMap((m,i)=>[
      {k:'q_'+m, l:'Qty', xl:monthName(m)+' Qty', w:80, g:monthName(m)},
      {k:'v_'+m, l:'Price ₹', xl:monthName(m)+' Price per piece', w:110, g:monthName(m), unit:true},
      ...(i ? [{k:'c_'+m, l:'Change %', xl:monthName(m)+' Price change %', w:96, g:monthName(m), pct:true}] : [])]),
    ...(proj.on ? [
      {k:'q_P', l:'Qty', xl:'Projection Qty', w:80, g:pg, proj:true},
      {k:'v_P', l:'Price ₹', xl:'Projection Price per piece', w:110, g:pg, unit:true, proj:true},
      {k:'c_P', l:'Change %', xl:'Projection change % vs latest', w:96, g:pg, pct:true, proj:true}] : []),
  ];
  const FIXED = 4;                                          // Material, Description, Vendor, Vendor Name
  // Total row: Qty = sum of qty; Price = total value = Σ(qty × price per piece), shown in crores
  const totals = {}; cols.slice(FIXED).filter(c=>!c.pct).forEach(c=>{
    const m = c.k.slice(2);
    totals[c.k] = c.unit ? list.reduce((a,r)=>a+(r['q_'+m]||0)*(r[c.k]||0), 0) : list.reduce((a,r)=>a+(r[c.k]||0), 0);
  });
  const rows = [...list.map(r=>({t:'d', it:r})), {t:'t'}];
  const PROJ_BG = {bgCell:'#f3f0fb'};                       // light violet tint for projection cells

  const getCell = useCallback(([col,row])=>{
    const r = rows[row], c = cols[col]; if(!r || !c) return txt('');
    const tint = o => c.proj && !o?.themeOverride ? {...o, themeOverride:PROJ_BG} : o;
    if(r.t==='t'){
      if(col===0) return txt('Total');
      if(c.pct){                                             // average of the materials' change % for this column
        const vals = list.map(r=>r[c.k]).filter(v=>v!=null);
        if(!vals.length) return txt('');
        const avg = Math.round(vals.reduce((a,b)=>a+b, 0) / vals.length * 100) / 100;
        return num(avg, 2, {displayData:'Avg ' + (avg>0?'+':'') + fmt(avg,2) + '%', themeOverride: avg>0 ? RED : avg<0 ? GREEN : undefined});
      }
      if(col<FIXED) return txt('');
      if(c.unit){ const cr = Math.round(totals[c.k] / 1e6) / 10;          // total value in crores, 1 decimal
        return num(cr, 1, {displayData:fmt(cr, 1) + ' Crs'}); }
      return num(totals[c.k], 0);
    }
    if(c.pct){                                               // red = price went up, green = went down
      const v = r.it[c.k]; if(v==null) return txt('', tint({}));
      const r2 = Math.round(v*100)/100;
      return num(r2, 2, tint({displayData:(r2>0?'+':'')+fmt(r2,2)+'%', themeOverride: r2>0 ? RED : r2<0 ? GREEN : undefined}));
    }
    if(col<FIXED) return txt(r.it[c.k]);
    const v = r.it[c.k] || 0;
    return num(v, c.unit ? 2 : 0, tint({displayData: v ? fmt(v, c.unit ? 2 : 0) : ''}));   // blank instead of 0 keeps the grid readable
  }, [rows, cols]);

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'}, h('div', {className:'l1'}, h('h2', null, 'Dashboard'))),
      h('div', {className:'acts'},
        h(Switch, {on:proj.on, onChange:on=>setProj({on}), label:'Projection'}),
        h('button', {className:'ib', title:'Projection settings', onClick:()=>setGear(true)}, '⚙'),
        h('span', {className:'vsep'}),
        h(DateRange, {from, to, setFrom, setTo}),
        h('span', {className:'vsep'}),
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h('button', {className:'ib', title:'Clear sort', onClick:()=>setSort(null)}, '⇅'))),
    h('div', {className:'gridbox'}, h(Grid, {cols, rows, getCell, sort, setSort, onStats, freeze:2})),
    gear && h(ProjectionModal, {proj, onClose:()=>setGear(false), onApply:p=>{ setProj({...p, on:true}); setGear(false); }})
  );
}

/* ---------- NRP: dated production requirement lines (feeds Material Planning) ---------- */
const NRP_COLS = [
  {k:'date', l:'Date', w:120}, {k:'material', l:'Material', w:120}, {k:'desc', l:'Mat Description', w:290},
  {k:'vendorCode', l:'Vendor', w:90}, {k:'vendor', l:'Vendor Name', w:190}, {k:'qty', l:'Qty', w:100},
];
// accepts 2026-12-03, 03-12-2026, 03/12/2026, 3.12.2026
function parseDay(t){
  t = String(t||'').trim(); let m;
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return isoDay(new Date(+m[1], m[2]-1, +m[3]));
  if((m = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return isoDay(new Date(+m[3], m[2]-1, +m[1]));
  return null;
}
function NrpSheet({range, bump, onStats, ask}){
  const [q, setQ] = useState(['','']);
  const [sort, setSort] = useState(null);
  const lines = NRP.filter(r=>inRange(r.date, range.from, range.to)).map(r=>{ const p = productByMaterial(r.material);
    return {...r, _r:r, desc:p?.name ?? '', vendorCode:p?.vendorCode ?? '', vendor:p?.vendor ?? '', model:p?.code ?? '', bad:!p}; })
    .filter(r=>matchQ(q, niceDay(r.date), r.date, r.material, r.desc, r.vendorCode, r.vendor, r.model));
  lines.sort(sort ? (a,b)=>{ const x=a[sort.k], y=b[sort.k]; return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sort.dir; }
                  : (a,b)=>a.date.localeCompare(b.date) || a.material.localeCompare(b.material) || a.id-b.id);
  const total = lines.reduce((a,r)=>a+(+r.qty||0),0);
  const rows = [...lines.map(r=>({t:'d', it:r})), {t:'t'}];

  const getCell = useCallback(([col,row])=>{
    const r = rows[row], k = NRP_COLS[col].k; if(!r) return txt('');
    if(r.t==='t') return col===0 ? txt('Total') : k==='qty' ? num(total) : txt('');
    const it = r.it, ed = {allowOverlay:true, readonly:false};
    if(k==='date')     return {kind:GridCellKind.Text, data:niceDay(it.date), displayData:niceDay(it.date), ...ed};
    if(k==='material') return {kind:GridCellKind.Text, data:it.material, displayData:it.material, ...ed, ...(it.bad ? {themeOverride:RED} : {})};
    if(k==='qty')      return {kind:GridCellKind.Number, data:it.qty, displayData:fmt(it.qty), contentAlign:'right', ...ed};
    return txt(it[k]);                                       // description / vendor come from Models
  }, [rows, total]);

  const onEdit = useCallback(([col,row], v)=>{
    const it = rows[row]?.it, k = NRP_COLS[col].k; if(!it) return;
    const r = it._r;                                         // TODO: PUT /api/nrp/{id}
    if(k==='qty' && v.kind===GridCellKind.Number && v.data!=null) r.qty = Math.max(0, Math.round(v.data));
    if(k==='date'){ const d = parseDay(v.data); if(d) r.date = d; }
    if(k==='material'){ const t = String(v.data||'').trim().toUpperCase();
      r.material = PRODUCTS.find(p=>p.code===t)?.material ?? t; }   // typing a model code also works
    bump();
  }, [rows, bump]);

  const onDelete = useCallback(sel=>{                        // Delete key on selected rows → confirm, then remove lines
    const idx = sel.rows.toArray().filter(i=>rows[i]?.t==='d');
    if(!idx.length) return true;                             // a cell range: let the grid clear cells normally
    ask({title:`Delete ${idx.length} NRP line${idx.length!==1?'s':''}?`, ok:'Delete', danger:true, onOk:()=>{
      idx.forEach(i=>{ const r = rows[i].it._r; NRP.splice(NRP.indexOf(r), 1); }); bump(); }});
    return false;
  }, [rows, ask, bump]);

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'}, h('div', {className:'l1'}, h('h2', null, 'NRP'))),
      h('div', {className:'acts'},
        h(DateRange, range),
        h('span', {className:'vsep'}),
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h('button', {className:'ib', title:'Clear sort', onClick:()=>setSort(null)}, '⇅'))),
    h('div', {className:'gridbox'}, h(Grid, {cols:NRP_COLS, rows, getCell, onEdit, onDelete, sort, setSort, onStats}))
  );
}

/* ---------- Models: one row per product model. The BOM tab reads model, vendor, motor/pump/panel and category from here. ---------- */
const MODEL_COLS = [
  {k:'material',   l:'Material', w:110},
  {k:'name',       l:'Material Description', w:270},
  {k:'code',       l:'Model', w:150},
  {k:'motor',      l:'Motor', w:130},
  {k:'pump',       l:'Pump', w:130},
  {k:'panel',      l:'Panel', w:120},
  {k:'vendorCode', l:'Vendor', w:90},
  {k:'vendor',     l:'Vendor Name', w:170},
  {k:'cat',        l:'Category', w:170},
];
const MODEL_KEYS = new Set(['material','code']);           // identifiers – not editable here (BOMs and plans point at them)
function ModelsSheet({bump, onStats, openBom}){
  const [sort, setSort] = useState(null);
  const [q, setQ] = useState(['','']);
  let list = PRODUCTS.filter(p=>matchQ(q, ...MODEL_COLS.map(c=>p[c.k])));
  if(sort) list.sort((a,b)=>String(a[sort.k]??'').localeCompare(String(b[sort.k]??''))*sort.dir);
  const rows = list.map(p=>({t:'d', it:p}));

  const getCell = useCallback(([col,row])=>{
    const p = rows[row]?.it, k = MODEL_COLS[col].k; if(!p) return txt('');
    const v = String(p[k] ?? '');
    if(k==='code') return txt(v, {themeOverride:{textDark:'#0563c1'}});          // click → open its BOM
    if(MODEL_KEYS.has(k)) return txt(v);
    return {kind:GridCellKind.Text, data:v, displayData:v, allowOverlay:true, readonly:false};
  }, [rows]);

  const onEdit = useCallback(([col,row], v)=>{
    const p = rows[row]?.it, k = MODEL_COLS[col].k;
    if(!p || MODEL_KEYS.has(k) || v.kind!==GridCellKind.Text) return;
    p[k] = String(v.data ?? '').trim();                       // TODO: PUT /api/models/{code}
    bump();
  }, [rows, bump]);

  return h(React.Fragment, null,
    h('div', {className:'strip head'},
      h('div', {className:'info'}, h('div', {className:'l1'}, h('h2', null, 'Models'))),
      h('div', {className:'acts'},
        h(SearchBox, {value:q, onChange:setQ}),
        h('span', {className:'vsep'}),
        h('button', {className:'ib', title:'Clear sort', onClick:()=>setSort(null)}, '⇅'))),
    h('div', {className:'gridbox'}, h(Grid, {cols:MODEL_COLS, rows, getCell, onEdit, sort, setSort, onStats, freeze:3,
      onCell:([col,row])=>{ if(MODEL_COLS[col].k==='code' && rows[row]) openBom(rows[row].it.code); }}))
  );
}

/* Sidebar search: type to find a product; picking it adds it to the sidebar and opens its BOM. */
function ProductSearch({opened, onPick}){
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(0);
  const ql = q.trim().toLowerCase();
  const opts = PRODUCTS.filter(p=>!ql || [p.code,p.material,p.vendorCode,p.cat,p.vendor,p.motor,p.pump,p.panel,p.name,p.fam,p.hp+' hp',p.ph].join(' ').toLowerCase().includes(ql)
                                  || p.bom.some(([c])=>(c+' '+MAT[c].desc).toLowerCase().includes(ql)));
  const pick = p => { onPick(p.code); setQ(''); setOpen(false); setHi(0); };
  const key = e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); setOpen(true); setHi(i=>Math.min(i+1, opts.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setHi(i=>Math.max(i-1, 0)); }
    else if(e.key==='Enter' && opts[hi]) pick(opts[hi]);
    else if(e.key==='Escape'){ setOpen(false); e.target.blur(); }
  };
  return h('div', {className:'psearch'},
    h('span', {className:'pick-ico'}, '⌕'),
    h('input', {value:q, placeholder:'Search product…', onKeyDown:key, onFocus:()=>setOpen(true), onBlur:()=>setOpen(false),
                onChange:e=>{ setQ(e.target.value); setOpen(true); setHi(0); }}),
    open ? h('div', {className:'pick-list ps-list'}, opts.length ? opts.map((p,i)=>h('div', {key:p.code, className:'ps-o'+(i===hi?' hi':''),
        onMouseDown:e=>{ e.preventDefault(); pick(p); }, onMouseEnter:()=>setHi(i)},
        h('div', {className:'pl1'}, h('b', null, p.code), opened.includes(p.code) ? h('span', {className:'ps-tag'}, 'open') : null,
          p.vendor ? h('span', {className:'pv'}, p.vendor) : null),
        h('div', {className:'muted'}, p.cat || p.fam)))
      : h('div', {className:'pick-none'}, 'No matching product')) : null);
}

/* Profile chip at the end of the top bar; the menu lists users (prototype switcher). */
function ProfileMenu({me, onSwitch}){
  const [open, setOpen] = useState(false);
  useEffect(()=>{ if(!open) return; const close = ()=>setOpen(false); window.addEventListener('click', close); return ()=>window.removeEventListener('click', close); }, [open]);
  return h('div', {className:'prof', onClick:e=>{ e.stopPropagation(); setOpen(o=>!o); }},
    h('span', {className:'av'}, initials(me.name)),
    h('span', {className:'pn'}, h('b', null, me.name), h('small', null, me.role)),
    h('span', {className:'caret'}, '▾'),
    open && h('div', {className:'pmenu', onClick:e=>e.stopPropagation()},
      h('div', {className:'pm-h'}, 'Switch user (prototype)'),
      USERS.map(u=>h('div', {key:u.id, className:'pm-o'+(u.id===me.id?' on':''), onClick:()=>{ setOpen(false); if(u.id!==me.id) onSwitch(u.id); }},
        h('span', {className:'av sm'}, initials(u.name)),
        h('span', {className:'pm-n'}, u.name, h('small', null, u.dept)),
        h('span', {className:'rtag '+u.role}, u.role)))));
}

/* ---------- App shell ---------- */
function App(){
  const [tab, setTab] = useState(location.hash==='#dashboard' ? 'dash' : location.hash==='#mrp' ? 'mrp' : location.hash==='#nrp' ? 'nrp' : location.hash==='#changes' ? 'cr' : location.hash==='#models' ? 'models' : ['#master','#prices'].includes(location.hash) ? 'master' : 'bom');
  const [crView, setCrView] = useState('requests');
  const [hist, setHist] = useState('');
  const [leave, setLeave] = useState(null);                   // pending navigation while drafts are unsaved
  const [confirmBox, setConfirmBox] = useState(null);         // {title, text, ok, danger, onOk}
  const [dl, setDl] = useState(false);                         // download dialog
  useEffect(()=>{                                              // Ctrl+)  (Ctrl+Shift+0) → download dialog
    const k = e => { if(e.ctrlKey && (e.key===')' || (e.shiftKey && e.code==='Digit0'))){ e.preventDefault(); setDl(true); } };
    window.addEventListener('keydown', k); return ()=>window.removeEventListener('keydown', k);
  }, []);
  const ask = useCallback(o=>setConfirmBox(o), []);
  const guard = fn => { if(DRAFT.size) setLeave(()=>fn); else fn(); };
  const goTab = t => { if(t===tab) return; guard(()=>setTab(t)); };
  const openHistory = c => guard(()=>{ setHist(c); setCrView('history'); setTab('cr'); });
  const [opened, setOpened] = useState([]);                  // products added to the sidebar (starts empty)
  const [code, setCode] = useState(null);                     // product whose BOM is shown
  const firstPlanMonth = NRP.map(r=>r.date.slice(0,7)).filter(m=>m>=CUR_MONTH).sort()[0] || CUR_MONTH;
  const [month, setMonth] = useState(firstPlanMonth);                // BOM tab: month for rates
  const [pFrom, setPFrom] = useState(monthStart(firstPlanMonth));    // NRP + Material Planning share this range
  const [pTo, setPTo] = useState(monthEnd(firstPlanMonth));
  const range = {from:pFrom, to:pTo, setFrom:setPFrom, setTo:setPTo};
  const [uid, setUid] = useState(USERS[0].id);               // prototype: comes from login in the real app
  const me = USERS.find(u=>u.id===uid) || USERS[0];
  ME = me;
  const role = me.name;                                       // the name is recorded as requester / approver
  const months = [...new Set([...NRP.map(r=>r.date.slice(0,7)), ...PRICES.map(e=>e.month)])].sort();
  const nPend = CHANGES.filter(c=>c.status==='Pending').length;   // pending requests
  const [ver, setVer] = useState(0);
  const [stats, setStats] = useState(null);
  const bump = useCallback(()=>setVer(v=>v+1), []);
  const product = PRODUCTS.find(p=>p.code===code);
  const openProduct = c => { setOpened(o=>o.includes(c) ? o : [...o, c]); setCode(c); };
  const closeProduct = c => {
    const i = opened.indexOf(c), rest = opened.filter(x=>x!==c);
    setOpened(rest);
    if(c===code) setCode(rest[Math.min(i, rest.length-1)] ?? null);   // show the neighbour, or nothing
  };

  return h('div', {className:'app'},
    h('div', {className:'top'},
      h('div', {className:'logo'}, 'PB'), h('b', null, 'PumpBOM'),
      h('div', {className:'tabs'},
        h('button', {className:'tab'+(tab==='bom'?' on':''), onClick:()=>goTab('bom')}, 'BOM'),
        h('button', {className:'tab'+(tab==='models'?' on':''), onClick:()=>goTab('models')}, 'Models'),
        h('button', {className:'tab'+(tab==='master'?' on':''), onClick:()=>goTab('master')}, 'Material Master'),
        h('button', {className:'tab'+(tab==='cr'?' on':''), onClick:()=>goTab('cr')}, 'Change Requests', nPend ? h('span', {className:'badge'}, nPend) : null),
        h('button', {className:'tab'+(tab==='nrp'?' on':''), onClick:()=>goTab('nrp')}, 'NRP'),
        h('button', {className:'tab'+(tab==='mrp'?' on':''), onClick:()=>goTab('mrp')}, 'Material Planning'),
        h('button', {className:'tab'+(tab==='dash'?' on':''), onClick:()=>goTab('dash')}, 'Dashboard')),
      h('div', {className:'sp'}),
      h(ProfileMenu, {me, onSwitch:id=>guard(()=>setUid(id))})
    ),
    h('div', {className:'main'},
      tab==='bom' && h('div', {className:'side'},                 // product list only matters on the BOM tab
        h(ProductSearch, {opened, onPick:openProduct}),
        h('div', {className:'plist'}, opened.map(c=>{ const p = PRODUCTS.find(x=>x.code===c);
          return h('div', {key:c, className:'pi'+(c===code?' on':''), onClick:()=>setCode(c), title:p.name},
            h('div', {className:'pi-txt'},
              h('div', {className:'pl1'}, h('b', null, p.code), p.vendor ? h('span', {className:'pv'}, p.vendor) : null),  // Product + Vendor
              h('div', null, p.cat || p.fam)),                                                                             // Category
            h('div', {className:'pi-btns'},
              h('button', {className:'dot cmp', title:'Compare (coming soon)', onClick:e=>e.stopPropagation()}, '⇄'),
              h('button', {className:'dot cls', title:'Remove from list', onClick:e=>{ e.stopPropagation(); closeProduct(c); }}, '✕')));
        }))
      ),
      h('div', {className:'work'},
        tab==='bom'    ? (product ? h(BomSheet, {key:code, ver, product, month, setMonth, months, bump, onStats:setStats}) : h('div', {className:'nobom'}, 'Search a product to open its BOM'))
      : tab==='models' ? h(ModelsSheet, {ver, bump, onStats:setStats, openBom:c=>{ openProduct(c); setTab('bom'); }})
      : tab==='master' ? h(MasterSheet, {ver, role, bump, onStats:setStats, openHistory, ask})
      : tab==='nrp'    ? h(NrpSheet, {ver, range, bump, onStats:setStats, ask})
      : tab==='cr'     ? h(ChangeRequestsSheet, {ver, role, bump, view:crView, setView:setCrView, hist, setHist, ask})
      : tab==='dash'   ? h(DashboardSheet, {ver, onStats:setStats})
                       : h(MrpSheet, {ver, range, onStats:setStats}))
    ),
    confirmBox && h('div', {className:'modal-bg', onKeyDown:e=>{ if(e.key==='Escape') setConfirmBox(null); }},
      h('div', {className:'modal'},
        h('h3', null, confirmBox.title),
        confirmBox.text ? h('p', null, confirmBox.text) : null,
        h('div', {className:'modal-a'},
          h('span', {className:'sp'}),
          h('button', {className:'btn', autoFocus:true, onClick:()=>setConfirmBox(null)}, 'Cancel'),
          h('button', {className:'btn ' + (confirmBox.danger ? 'danger' : 'primary'), onClick:()=>{ const f = confirmBox.onOk; setConfirmBox(null); f(); }}, confirmBox.ok)))),
    leave && h('div', {className:'modal-bg'},
      h('div', {className:'modal'},
        h('h3', null, 'Unsaved changes'),
        h('p', null, `You have ${DRAFT.size} unsaved edit${DRAFT.size!==1?'s':''} in Material Master. Save them as a change request before leaving?`),
        h('div', {className:'modal-a'},
          h('button', {className:'btn', onClick:()=>setLeave(null)}, 'Stay'),
          h('span', {className:'sp'}),
          h('button', {className:'btn no', onClick:()=>{ discardDraft(); const f=leave; setLeave(null); bump(); f(); }}, 'Discard & leave'),
          h('button', {className:'btn primary', onClick:()=>{ saveDraft(role); const f=leave; setLeave(null); bump(); f(); }}, 'Save & leave')))),
    dl && h(DownloadModal, {label:{bom:code ? 'BOM '+code : 'BOM', models:'Models', master:'Material Master', cr:'Change Requests', nrp:'NRP', mrp:'Material Planning', dash:'Dashboard'}[tab] || 'Grid', onClose:()=>setDl(false)}),
    h('div', {className:'status'},
      h('span', null, DRAFT.size ? `${DRAFT.size} unsaved edit${DRAFT.size!==1?'s':''}` : 'Ready'), h('span', {className:'sp'}),
      stats && stats.n ? h('span', null, 'Average: ', h('b', null, fmt(stats.sum/stats.n,2))) : null,
      stats ? h('span', null, 'Count: ', h('b', null, stats.cnt)) : null,
      stats && stats.n ? h('span', null, 'Sum: ', h('b', null, fmt(stats.sum,2))) : null,
      h('button', {className:'sb-dl', title:'Download this grid (Ctrl+) )', onClick:()=>setDl(true)}, '⤓ Download'))
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
